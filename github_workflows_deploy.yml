name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_KEY }}
          script: |
            cd ~/3118_Janghyunje

            echo "=== Git Pull ==="
            git pull origin main

            echo "=== Frontend Build ==="
            cd frontend
            npm install --legacy-peer-deps
            npm run build

            echo "=== Backend Install ==="
            cd ../backend
            npm install --omit=dev

            echo "=== PM2 Restart ==="
            pm2 restart all --update-env

            echo "=== Health Check ==="
            sleep 3
            curl -f http://localhost:3000/health && echo "✅ 서버 정상" || echo "❌ 서버 이상"
